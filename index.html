<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>ADE — Intelligent AI Assistant</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#08090d;
  color:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "SF Pro Text",Arial,sans-serif;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;

  background:
    linear-gradient(
      rgba(0,0,0,.48),
      rgba(0,0,0,.62)
    ),
    url("CB85B8F3-2BFF-43FE-9414-CB81149E7C9C.jpeg");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}


/* ================= HEADER ================= */

.header{
  height:76px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px 14px;

  background:rgba(8,8,12,.62);

  border-bottom:1px solid rgba(255,255,255,.09);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  font-size:25px;
  font-weight:800;

  background:
    linear-gradient(
      135deg,
      #8b55ff,
      #c63df0
    );

  box-shadow:
    0 7px 25px
    rgba(155,65,255,.25);
}

.brand h1{
  margin:0;
  font-size:23px;
  letter-spacing:-.5px;
  text-transform:lowercase;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:3px;

  color:#b0b3c0;
  font-size:12px;

  text-transform:lowercase;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#35d69a;

  box-shadow:
    0 0 10px
    rgba(53,214,154,.6);
}

.reset{
  width:42px;
  height:42px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;

  background:rgba(20,21,29,.78);

  color:#ddd;

  font-size:21px;

  cursor:pointer;

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.reset:active{
  transform:scale(.94);
}


/* ================= CHAT ================= */

.chat{
  flex:1;

  overflow-y:auto;

  padding:
    22px
    14px
    145px;

  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  display:none;
}

.message{
  display:flex;
  margin-bottom:18px;

  animation:
    messageIn
    .2s
    ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.avatar{
  width:40px;
  height:40px;
  min-width:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-right:9px;

  border-radius:13px;

  font-size:18px;
  font-weight:800;

  background:
    linear-gradient(
      135deg,
      #8b55ff,
      #c13ce9
    );

  box-shadow:
    0 5px 18px
    rgba(120,60,230,.25);
}

.bubble{
  max-width:88%;

  padding:
    12px
    14px;

  border-radius:17px;

  font-size:16px;
  line-height:1.55;

  white-space:pre-wrap;
  word-break:break-word;
}

.message.ai .bubble{
  background:rgba(12,15,22,.78);

  border:
    1px solid
    rgba(255,255,255,.10);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  text-transform:lowercase;
}

.message.user .bubble{
  background:
    linear-gradient(
      135deg,
      #7545e8,
      #a33cb0
    );

  border-radius:
    18px
    7px
    18px
    18px;

  box-shadow:
    0 5px 18px
    rgba(100,50,180,.18);
}


/* ================= TYPING ================= */

.typing{
  display:none;

  align-items:center;

  gap:4px;

  margin:
    0
    0
    10px
    50px;
}

.typing.show{
  display:flex;
}

.typing span{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#aaa;

  animation:
    typing
    1.2s
    infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }

  30%{
    transform:translateY(-4px);
    opacity:1;
  }
}


/* ================= INPUT ================= */

.input-area{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  padding:
    9px
    14px
    calc(
      9px +
      env(safe-area-inset-bottom)
    );

  background:
    rgba(7,8,12,.70);

  border-top:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.input-box{
  min-height:58px;

  display:flex;
  align-items:flex-end;

  gap:8px;

  padding:
    7px
    8px
    7px
    15px;

  border-radius:22px;

  background:rgba(18,21,28,.82);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

textarea{
  flex:1;
  min-width:0;

  max-height:120px;

  resize:none;

  outline:none;
  border:0;

  background:transparent;

  color:#fff;

  font-family:inherit;
  font-size:16px;
  line-height:1.45;

  padding:8px 0;
}

textarea::placeholder{
  color:#858894;
}

.send{
  width:46px;
  height:46px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #8751ff,
      #c13be9
    );

  color:white;

  font-size:24px;

  cursor:pointer;

  box-shadow:
    0 5px 16px
    rgba(130,65,230,.25);
}

.send:active{
  transform:scale(.94);
}

.send:disabled{
  opacity:.4;
}

.warning{
  text-align:center;

  color:#8a8d98;

  font-size:10px;

  margin-top:5px;

  text-transform:lowercase;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

  .header{
    padding:10px 13px;
  }

  .chat{
    padding-left:13px;
    padding-right:13px;
  }

  .bubble{
    font-size:16px;
  }

}
</style>
</head>


<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="logo">A</div>

      <div>

        <h1>ade</h1>

        <div class="status">

          <span class="dot"></span>

          intelligent ai assistant

        </div>

      </div>

    </div>

    <button
      class="reset"
      id="reset"
      type="button"
      aria-label="new chat"
    >
      ↻
    </button>

  </header>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  ></main>


  <!-- TYPING -->

  <div
    class="typing"
    id="typing"
  >

    <span></span>
    <span></span>
    <span></span>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <div class="input-box">

      <textarea
        id="input"
        rows="1"
        placeholder="message ade..."
        autocomplete="off"
        spellcheck="true"
      ></textarea>

      <button
        class="send"
        id="send"
        type="button"
        aria-label="send message"
      >
        ↑
      </button>

    </div>

    <div class="warning">
      ade may make mistakes. verify important information.
    </div>

  </div>

</div>


<!-- PUTER.JS -->

<script src="https://js.puter.com/v2/"></script>


<script>

/*
=========================================================
ADE SYSTEM
=========================================================
*/

const ADE_SYSTEM = `

You are ADE, a professional general-purpose AI assistant.

Your job is to understand the user naturally
and provide useful, accurate and direct answers.

LANGUAGES:

Understand Cebuano / Bisaya.

Understand Tagalog.

Understand English.

Understand Taglish.

Understand Bisaya-English.

Understand slang.

Understand abbreviations.

Understand shortcuts.

Understand informal spelling.

Understand typos.

Understand phonetic spelling.

Understand casual internet language.

Do not criticize the user's grammar.

Understand what the user means from context.

CONVERSATION:

Remember the current conversation.

Use previous messages as context.

Follow topic changes naturally.

Do not repeatedly ask unnecessary questions.

Do not provide suggested question buttons.

Answer directly.

If enough information is available,
do not ask another question.

STYLE:

Professional.

Natural.

Friendly.

Clear.

Direct.

Not robotic.

Match the user's language.

If the user speaks Bisaya,
respond naturally in Bisaya.

If the user speaks Tagalog,
respond naturally in Tagalog.

If the user speaks English,
respond naturally in English.

CAPABILITIES:

Technology.

Phones.

Computers.

Coding.

HTML.

CSS.

JavaScript.

Web development.

School.

Mathematics.

Science.

History.

Geography.

Writing.

Translation.

English grammar.

Cebuano.

Tagalog.

Gaming.

Apps.

Troubleshooting.

Relationships.

Everyday questions.

Creative work.

Problem solving.

ACCURACY:

Never invent facts.

Never pretend to know something
you do not know.

When uncertain, clearly say so.

Do not claim real-time information
unless the model has access to it.

PRIVACY:

Do not access private accounts.

Do not steal passwords.

Do not expose private information.

Do not claim to know another person's
private thoughts.

Your name is ADE.

`;


/*
=========================================================
ELEMENTS
=========================================================
*/

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const send =
  document.getElementById("send");

const reset =
  document.getElementById("reset");

const typing =
  document.getElementById("typing");


/*
=========================================================
CONVERSATION MEMORY
=========================================================
*/

let conversation = [];


/*
=========================================================
ADD MESSAGE
=========================================================
*/

function addMessage(text,type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  if(type === "ai"){

    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      "A";

    message.appendChild(
      avatar
    );

  }


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  /*
  AI TEXT = LOWERCASE
  */

  if(type === "ai"){

    bubble.textContent =
      String(text).toLowerCase();

  }else{

    bubble.textContent =
      text;

  }


  message.appendChild(
    bubble
  );


  chat.appendChild(
    message
  );


  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/*
=========================================================
WELCOME
=========================================================
*/

addMessage(
  "hi, i'm ade. send me anything and i'll help you.",
  "ai"
);


/*
=========================================================
AI REQUEST
=========================================================
*/

async function askADE(){

  const messages = [

    {
      role:"system",
      content:ADE_SYSTEM
    },

    ...conversation

  ];


  const response =
    await puter.ai.chat(
      messages,
      false,
      {
        model:"gpt-5.6-luna",
        normalize:true
      }
    );


  if(
    response &&
    response.message &&
    typeof response.message.content === "string"
  ){

    return response.message.content;

  }


  if(
    response &&
    typeof response.text === "string"
  ){

    return response.text;

  }


  if(
    typeof response === "string"
  ){

    return response;

  }


  return "ade couldn't generate a response.";

}


/*
=========================================================
SEND MESSAGE
=========================================================
*/

async function sendMessage(){

  const text =
    input.value.trim();


  if(
    !text ||
    send.disabled
  ){

    return;

  }


  addMessage(
    text,
    "user"
  );


  conversation.push({

    role:"user",

    content:text

  });


  input.value = "";

  input.style.height =
    "auto";


  send.disabled =
    true;

  typing.classList.add(
    "show"
  );


  try{

    const answer =
      await askADE();


    conversation.push({

      role:"assistant",

      content:answer

    });


    typing.classList.remove(
      "show"
    );


    addMessage(
      answer,
      "ai"
    );


  }catch(error){

    console.error(
      "ADE ERROR:",
      error
    );


    typing.classList.remove(
      "show"
    );


    let message =
      "ade couldn't connect right now.";


    if(error){

      if(error.message){

        message +=
          "\n\n" +
          error.message;

      }else{

        message +=
          "\n\n" +
          String(error);

      }

    }


    addMessage(
      message,
      "ai"
    );

  }


  send.disabled =
    false;

  input.focus();

}


/*
=========================================================
SEND BUTTON
=========================================================
*/

send.addEventListener(
  "click",
  sendMessage
);


/*
=========================================================
ENTER TO SEND
SHIFT + ENTER = NEW LINE
=========================================================
*/

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/*
=========================================================
AUTO RESIZE
=========================================================
*/

input.addEventListener(
  "input",
  function(){

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        120
      ) + "px";

  }
);


/*
=========================================================
NEW CHAT
=========================================================
*/

reset.addEventListener(
  "click",
  function(){

    conversation = [];

    chat.innerHTML = "";

    addMessage(
      "new conversation started. i'm ade.",
      "ai"
    );

    input.focus();

  }
);

</script>

</body>
</html>
